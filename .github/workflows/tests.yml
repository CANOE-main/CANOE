name: 📝 Run pytest

on:
    push:
        branches: [main, unstable]
    pull_request:
        branches: [main, unstable]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: "3.12"

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run tests
              run: uv run pytest
