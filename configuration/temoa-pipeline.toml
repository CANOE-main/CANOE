input_database = "canoe-pwd/canoe-v4-ON-low.sqlite"

# Reduce the database to representative days before running Temoa
[representative_periods_config]
# What the reduced database keeps of each demand: "hourly" values of the
# representative days (the annual demand changes) or the "annual" demand
demand_preservation = "hourly"
# Share of each demand's distribution set to zero, from its smallest values
dsd_threshold = 0.01

# The clustering to apply: one of a collection precomputed with tsam
[representative_periods_config.clustering]
kind = "tsam_collection"
collection = "src/canoe/representative_periods/data/clusterings/weather2018-hierarchical-pca6"
n_periods = 1

[temoa_config]
scenario_mode = "perfect_foresight"
silent = false
save_duals = true
save_lp_file = true
extensions = ["growth_rates"]

[temoa_config.solver]
name = "pounce"
options = { tol = 1.0e-4, print_level = 11, solver_selection = "lp-ipm" }
