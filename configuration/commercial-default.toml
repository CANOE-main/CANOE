module_name = "commercial"
data_version = "003"
base_year = 2022
end_uses = ["space heating", "space cooling", "other"]

# period_step = 5
# timezone = "EST"

# DSD Parameters
include_dsd = true
dsd_time_slices = { kind = "all_year" }

# EPA
EPA_emission_commodity = "co2e"

[ceud_config]
# This is used to inform existing capacity
base_year = 2022

[comstock_config]
building_types = [
  "fullservicerestaurant",
  "hospital",
  "largehotel",
  "largeoffice",
  "mediumoffice",
  "outpatient",
  "primaryschool",
  "quickservicerestaurant",
  "retailstandalone",
  "retailstripmall",
  "secondaryschool",
  "smallhotel",
  "smalloffice",
  "warehouse",
]

# Arbitrary mapping from US states to Canadian provinces
# to use with comstock data
[comstock_config.us_map]
ON = "MI"
AB = "MT"
BC = "WA"
QC = "ME"
MB = "ND"
SK = "ND"
NLLAB = "ME"
PEI = "ME"
NS = "ME"
NB = "ME"

[comstock_config.apply_weather_mapping]
"space heating" = true
"space cooling" = true
"other" = false

[aeo_config.us_census_mapping]
ON = "east north central"
AB = "mountain"
BC = "pacific"
QC = "new england"
MB = "mountain"
SK = "mountain"
NLLAB = "new england"
PEI = "new england"
NS = "new england"
NB = "new england"
